name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: |
          # next/font 会在构建时拉取 Google Fonts，偶发被限流导致失败，重试最多 3 次
          for attempt in 1 2 3; do
            echo "::group::Build attempt $attempt"
            if npm run build; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "构建失败（第 $attempt 次），10 秒后重试..."
            sleep 10
          done
          echo "三次构建均失败"
          exit 1
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
